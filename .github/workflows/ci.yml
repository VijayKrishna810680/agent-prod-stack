name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.x"
      - name: Set up Python
        run: uv python install 3.11
      - name: Create virtual environment
        run: uv venv --python 3.11
      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          source .venv/bin/activate
          ruff check .
      - name: Test (pytest)
        run: |
          source .venv/bin/activate
          pytest --maxfail=1 -q
  build-image:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t agent-prod-stack:ci .
